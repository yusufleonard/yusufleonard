<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#1a0000"/>
      <stop offset="1" stop-color="#400b00"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="110" rx="12"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .blink { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dash { stroke-dasharray: 60 20; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -80; } }
    .dash2 { stroke-dasharray: 60 20; animation: dash2 1.2s linear infinite; }
    @keyframes dash2 { to { stroke-dashoffset: 80; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="110" fill="url(#bg)"/>
    <line class="dash" x1="0" y1="3" x2="1000" y2="3" stroke="#ff3b00" stroke-width="3"/>
    <text class="mono" x="500" y="52" font-size="16" fill="#ff6a00" text-anchor="middle" letter-spacing="5">// END OF TRANSMISSION //</text>
    <text class="mono" x="500" y="80" font-size="13" fill="#8a8a8a" text-anchor="middle" letter-spacing="3">TALK IS CHEAP. SHOW ME THE CODE.<tspan class="blink" fill="#ff3b00"> _</tspan></text>
    <line class="dash2" x1="0" y1="107" x2="1000" y2="107" stroke="#ff3b00" stroke-width="3"/>
  </g>
</svg>
