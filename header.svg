<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.6" stop-color="#1a0000"/>
      <stop offset="1" stop-color="#400b00"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a00"/>
      <stop offset="0.5" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff3b00" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff3b00" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff3b00" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .title { font-family: Impact, 'Arial Black', 'Helvetica Neue', sans-serif; font-weight: 900; letter-spacing: 10px; }
    .grid { animation: gridmove 3s linear infinite; }
    @keyframes gridmove { from { transform: translateY(0); } to { transform: translateY(40px); } }
    .scan { animation: scan 4s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(-130px); } 100% { transform: translateY(300px); } }
    .gA { animation: gA 3.6s infinite; opacity: 0; }
    .gB { animation: gB 3.6s infinite; opacity: 0; }
    @keyframes gA {
      0%, 86%, 100% { transform: translate(0,0); opacity: 0; }
      88% { transform: translate(-7px,2px); opacity: .9; }
      91% { transform: translate(5px,-2px); opacity: .9; }
      94% { transform: translate(-3px,1px); opacity: .9; }
      96% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes gB {
      0%, 87%, 100% { transform: translate(0,0); opacity: 0; }
      89% { transform: translate(7px,-2px); opacity: .8; }
      92% { transform: translate(-5px,2px); opacity: .8; }
      95% { transform: translate(3px,0); opacity: .8; }
      97% { transform: translate(0,0); opacity: 0; }
    }
    .blink { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .dash { stroke-dasharray: 60 20; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -80; } }
    .rise { animation: rise 1.2s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect class="grid" y="-40" width="1000" height="340" fill="url(#grid)"/>
    <rect class="scan" width="1000" height="130" fill="url(#scan)"/>

    <!-- HUD kecil -->
    <circle class="pulse" cx="40" cy="38" r="5" fill="#ff3b00"/>
    <text class="mono" x="55" y="43" font-size="14" fill="#ff6a00" letter-spacing="3">SYS://ONLINE</text>
    <text class="mono" x="960" y="43" font-size="14" fill="#7a7a7a" letter-spacing="3" text-anchor="end">ID-INDONESIA // v1.0</text>

    <!-- Nama (ganti USERNAME di 3 tempat) -->
    <g class="rise">
      <text class="title gA" x="500" y="162" font-size="96" fill="#ffffff" text-anchor="middle">USERNAME</text>
      <text class="title gB" x="500" y="162" font-size="96" fill="#ff0000" text-anchor="middle">USERNAME</text>
      <text class="title" x="500" y="162" font-size="96" fill="url(#fire)" text-anchor="middle" filter="url(#glow)">USERNAME</text>
    </g>

    <!-- Subjudul -->
    <text class="mono" x="500" y="212" font-size="17" fill="#d6d6d6" text-anchor="middle" letter-spacing="4">FULL-STACK  //  MOBILE  //  DATABASE  //  UI·UX  //  3D GAME  //  SERVER</text>
    <text class="mono blink" x="500" y="248" font-size="18" fill="#ff3b00" text-anchor="middle" letter-spacing="3">&gt; READY_TO_BUILD _</text>

    <!-- Garis bawah animasi -->
    <line class="dash" x1="0" y1="288" x2="1000" y2="288" stroke="#ff3b00" stroke-width="3"/>
  </g>

  <!-- Siku pojok -->
  <g stroke="#ff3b00" stroke-width="3" fill="none">
    <path d="M12 52V12H52"/>
    <path d="M948 12H988V52"/>
    <path d="M12 248V288H52"/>
    <path d="M948 288H988V248"/>
  </g>
</svg>
