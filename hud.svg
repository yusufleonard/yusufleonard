<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a00"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff6a00" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff3b00" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bar"><rect x="40" y="100" width="920" height="3" rx="1.5"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .label { font-size: 12px; fill: #7d7d7d; letter-spacing: 3px; }
    .value { font-size: 21px; font-weight: 700; fill: #f2f2f2; letter-spacing: 1px; }
    .hot { fill: #ff6a00; }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .ring { animation: ring 1.4s ease-out infinite; transform-origin: 48px 61px; }
    @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
    .sweep { animation: sweep 2.8s linear infinite; }
    @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(960px); } }
    .load { animation: load 3.2s ease-in-out infinite alternate; }
    @keyframes load { from { width: 640px; } to { width: 700px; } }
  </style>

  <rect x="1" y="1" width="998" height="118" rx="12" fill="#0a0a0a" stroke="#ff3b00" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Kolom 1: status -->
  <circle class="ring" cx="48" cy="61" r="5" fill="none" stroke="#ff3b00" stroke-width="2"/>
  <circle class="pulse" cx="48" cy="61" r="5" fill="#ff3b00"/>
  <text class="mono label" x="66" y="42">STATUS</text>
  <text class="mono value hot" x="66" y="72">ONLINE</text>

  <line x1="250" y1="26" x2="250" y2="82" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Kolom 2 -->
  <text class="mono label" x="280" y="42">ROLE</text>
  <text class="mono value" x="280" y="72">FULL-STACK ENG.</text>

  <line x1="520" y1="26" x2="520" y2="82" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Kolom 3 -->
  <text class="mono label" x="550" y="42">BASE</text>
  <text class="mono value" x="550" y="72">INDONESIA</text>

  <line x1="740" y1="26" x2="740" y2="82" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Kolom 4 -->
  <text class="mono label" x="770" y="42">MODE</text>
  <text class="mono value hot" x="770" y="72">GRINDING 24/7</text>

  <!-- Bar load -->
  <rect x="40" y="100" width="920" height="3" rx="1.5" fill="#1f1f1f"/>
  <rect class="load" x="40" y="100" width="640" height="3" rx="1.5" fill="url(#fire)"/>
  <g clip-path="url(#bar)">
    <rect class="sweep" x="40" y="99" width="160" height="5" fill="url(#beam)"/>
  </g>
</svg>
